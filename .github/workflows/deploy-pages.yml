name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot and web export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -sSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p tmpl "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d tmpl 'templates/web_*'
          mv tmpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 120
          --log artifacts/godot-validation/import.log
          --import-project

      # Runner pracuje na kopii projektu z osobnym user://. Pilnuje też czasu,
      # bo błąd parsowania potrafi pozostawić Godota bez końcowego kodu wyjścia.
      - name: Check definitions
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 60
          --log artifacts/godot-validation/check.log
          -- --check

      - name: Check budget behavior
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 60
          --log artifacts/godot-validation/check-budget.log
          -- --check-budget

      - name: Check budget UI
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 60
          --log artifacts/godot-validation/check-budget-ui.log
          -- --check-budget-ui

      - name: Check career behavior
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 60
          --log artifacts/godot-validation/check-career.log
          -- --check-career

      - name: Check event chains
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 60
          --log artifacts/godot-validation/check-chains.log
          -- --check-chains

      - name: Check career UI
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 60
          --log artifacts/godot-validation/check-career-ui.log
          -- --check-career-ui

      - name: Check progression behavior
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 60
          --log artifacts/godot-validation/check-progression.log
          -- --check-progression

      - name: Check progression events
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 60
          --log artifacts/godot-validation/check-progression-events.log
          -- --check-progression-events

      - name: Check progression UI
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 60
          --log artifacts/godot-validation/check-progression-ui.log
          -- --check-progression-ui

      - name: Check groups behavior
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 60
          --log artifacts/godot-validation/check-groups.log
          -- --check-groups

      - name: Check group events
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 60
          --log artifacts/godot-validation/check-group-events.log
          -- --check-group-events

      - name: Check groups UI
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 60
          --log artifacts/godot-validation/check-groups-ui.log
          -- --check-groups-ui

      - name: Simulate 120 days
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 120
          --log artifacts/godot-validation/simulate-120.log
          -- --simulate=120 --seed=7 --start=2026-09-12 --wipe

      - name: Export web build
        run: >-
          python3 scripts/ci/run_godot.py
          --godot ./godot
          --timeout 180
          --log artifacts/godot-validation/export-web.log
          --export-release Web
          --output build/web/index.html

      - name: List web build
        run: ls -la build/web

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: artifacts/godot-validation/*.log
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
